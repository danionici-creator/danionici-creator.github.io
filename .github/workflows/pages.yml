name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    # hourly: GitHub may start a scheduled run hours late, so a single daily run published posts in the afternoon;
    # posts are due at 07:00 UTC (09:00 in Romania) and appear with the first run after that
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography==49.0.0
      - run: python tools/build_blog.py
        env:
          BLOG_KEY: ${{ secrets.BLOG_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
